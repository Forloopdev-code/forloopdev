name: forloopdev-production
region: nyc3

services:
  - name: web
    github:
      repo: Forloopdev-code/forloopdev
      branch: master
      deploy_on_push: false  # Deploy via GitHub Actions with approval

    build_command: |
      composer install --no-dev --optimize-autoloader --no-interaction
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan event:cache

    run_command: |
      php artisan migrate --force
      vendor/bin/heroku-php-apache2 public/

    environment_slug: php
    instance_count: 3  # More instances for production
    instance_size_slug: professional-s  # Larger instances for production

    http_port: 8080

    health_check:
      http_path: /
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      # Application
      - key: APP_NAME
        value: "Forloop"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: ${PRODUCTION_APP_KEY}
        type: SECRET
      - key: APP_URL
        value: "https://forloop.dev"
      - key: LOG_CHANNEL
        value: "stack"
      - key: LOG_LEVEL
        value: "error"

      # Database (MySQL)
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: ${PRODUCTION_DB_HOST}
        type: SECRET
      - key: DB_PORT
        value: "25060"
      - key: DB_DATABASE
        value: ${PRODUCTION_DB_DATABASE}
        type: SECRET
      - key: DB_USERNAME
        value: ${PRODUCTION_DB_USERNAME}
        type: SECRET
      - key: DB_PASSWORD
        value: ${PRODUCTION_DB_PASSWORD}
        type: SECRET

      # Cache & Sessions (Redis/Valkey)
      - key: CACHE_DRIVER
        value: "redis"
      - key: SESSION_DRIVER
        value: "redis"
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: "redis"
      - key: REDIS_SCHEME
        value: "tls"
      - key: REDIS_CLIENT
        value: "phpredis"
      - key: REDIS_HOST
        value: ${PRODUCTION_REDIS_HOST}
        type: SECRET
      - key: REDIS_PASSWORD
        value: ${PRODUCTION_REDIS_PASSWORD}
        type: SECRET
      - key: REDIS_PORT
        value: "25061"

      # File Storage (DigitalOcean Spaces)
      - key: FILESYSTEM_DISK
        value: "s3"
      - key: AWS_ACCESS_KEY_ID
        value: ${PRODUCTION_SPACES_KEY}
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        value: ${PRODUCTION_SPACES_SECRET}
        type: SECRET
      - key: AWS_DEFAULT_REGION
        value: "nyc3"
      - key: AWS_BUCKET
        value: "forloopdev-production-uploads"
      - key: AWS_ENDPOINT
        value: "https://nyc3.digitaloceanspaces.com"
      - key: AWS_URL
        value: "https://forloopdev-production-uploads.nyc3.digitaloceanspaces.com"
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"

      # Mail
      - key: MAIL_MAILER
        value: "smtp"
      - key: MAIL_HOST
        value: "smtp.sendgrid.net"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: ${PRODUCTION_MAIL_USERNAME}
        type: SECRET
      - key: MAIL_PASSWORD
        value: ${PRODUCTION_MAIL_PASSWORD}
        type: SECRET
      - key: MAIL_ENCRYPTION
        value: "tls"
      - key: MAIL_FROM_ADDRESS
        value: "hello@forloop.dev"
      - key: MAIL_FROM_NAME
        value: "Forloop"

      # Broadcasting
      - key: BROADCAST_DRIVER
        value: "log"

      # Vite
      - key: VITE_APP_NAME
        value: "Forloop"

  # Queue Worker
  - name: worker
    github:
      repo: Forloopdev-code/forloopdev
      branch: master
      deploy_on_push: false

    build_command: |
      composer install --no-dev --optimize-autoloader --no-interaction

    run_command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

    environment_slug: php
    instance_count: 2  # More workers for production
    instance_size_slug: professional-xs

    envs:
      - key: APP_NAME
        value: "Forloop"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: ${PRODUCTION_APP_KEY}
        type: SECRET
      - key: APP_URL
        value: "https://forloop.dev"
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: ${PRODUCTION_DB_HOST}
        type: SECRET
      - key: DB_PORT
        value: "25060"
      - key: DB_DATABASE
        value: ${PRODUCTION_DB_DATABASE}
        type: SECRET
      - key: DB_USERNAME
        value: ${PRODUCTION_DB_USERNAME}
        type: SECRET
      - key: DB_PASSWORD
        value: ${PRODUCTION_DB_PASSWORD}
        type: SECRET
      - key: CACHE_DRIVER
        value: "redis"
      - key: QUEUE_CONNECTION
        value: "redis"
      - key: REDIS_SCHEME
        value: "tls"
      - key: REDIS_CLIENT
        value: "phpredis"
      - key: REDIS_HOST
        value: ${PRODUCTION_REDIS_HOST}
        type: SECRET
      - key: REDIS_PASSWORD
        value: ${PRODUCTION_REDIS_PASSWORD}
        type: SECRET
      - key: REDIS_PORT
        value: "25061"

  # Scheduler (Cron)
  - name: scheduler
    github:
      repo: Forloopdev-code/forloopdev
      branch: master
      deploy_on_push: false

    build_command: |
      composer install --no-dev --optimize-autoloader --no-interaction

    run_command: |
      while true; do
        php artisan schedule:run --verbose --no-interaction
        sleep 60
      done

    environment_slug: php
    instance_count: 1
    instance_size_slug: professional-xs

    envs:
      - key: APP_NAME
        value: "Forloop"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: ${PRODUCTION_APP_KEY}
        type: SECRET
      - key: APP_URL
        value: "https://forloop.dev"
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: ${PRODUCTION_DB_HOST}
        type: SECRET
      - key: DB_PORT
        value: "25060"
      - key: DB_DATABASE
        value: ${PRODUCTION_DB_DATABASE}
        type: SECRET
      - key: DB_USERNAME
        value: ${PRODUCTION_DB_USERNAME}
        type: SECRET
      - key: DB_PASSWORD
        value: ${PRODUCTION_DB_PASSWORD}
        type: SECRET
      - key: CACHE_DRIVER
        value: "redis"
      - key: REDIS_SCHEME
        value: "tls"
      - key: REDIS_CLIENT
        value: "phpredis"
      - key: REDIS_HOST
        value: ${PRODUCTION_REDIS_HOST}
        type: SECRET
      - key: REDIS_PASSWORD
        value: ${PRODUCTION_REDIS_PASSWORD}
        type: SECRET
      - key: REDIS_PORT
        value: "25061"
